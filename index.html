<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3F4F1">
<title>Teodoro · Expediente médico</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Ficha clínica clara: fondo verde grisáceo, tinta casi negra, un azul para las series y tres estados. */
:root{
  --ground:#F3F4F1;--surface:#FFFFFF;--soft:#F8F9F7;--ink:#16191B;--ink2:#2C3136;--muted:#596067;--line:#E1E3DE;--line2:#ECEEEA;
  --series:#1E4F8F;--band:#E2EDE5;--bandline:#CFE2D5;--hito:#9AA0A5;--select:#EEF2F8;
  --ok:#1D7348;--ok-bg:#E3F1E8;--watch:#8F5600;--watch-dot:#B26B00;--watch-bg:#FAEFD9;--alert:#A8261E;--alert-bg:#FAE7E4;
  --radius:14px;--side:248px;
  --font:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--ground);color:var(--ink);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;overflow-x:hidden}
a{color:var(--series)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--series);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance}
svg{display:block}

/* ---------- Estructura ---------- */
.app{display:flex;min-height:100vh;max-width:1440px;margin:0 auto}
.side{position:sticky;top:0;align-self:flex-start;height:100vh;width:var(--side);flex:0 0 var(--side);padding:28px 18px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line);overflow-y:auto}
.who{display:flex;align-items:center;gap:12px}
.who img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#2a2e33}
.who b{display:block;font-size:18px}
.who span{font-size:13px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:13px;color:var(--muted);padding:14px 12px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:#454B51;text-decoration:none;font-size:15px}
.nav a:hover{background:#E9EBE6;color:var(--ink)}
.nav a.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.nav a .cnt{margin-left:auto;font-size:13px;color:var(--muted);font-weight:400}
.dot{width:8px;height:8px;border-radius:2px;flex:0 0 8px}
.dot.ok{background:var(--ok)}.dot.watch{background:var(--watch-dot)}.dot.alert{background:var(--alert)}
.side .dx{margin-top:auto;font-size:13px;color:var(--muted);line-height:1.45;display:flex;flex-direction:column;gap:4px}
.side .dx b{color:var(--ink);font-weight:600}
main{flex:1 1 auto;min-width:0;padding:32px 40px 64px}
.mtop,.tabbar{display:none}
.view{display:none;max-width:1120px}
.view.on{display:block}

/* ---------- Elementos comunes ---------- */
.eyebrow{font-size:14px;color:var(--muted)}
.h1{font-size:32px;line-height:1.18;font-weight:700;letter-spacing:-.015em}
.lead{font-size:17px;line-height:1.5;color:var(--ink2);max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.sec{margin-top:28px}
.sec>h2{font-size:18px;font-weight:700;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.watch{background:var(--watch-bg);color:var(--watch)}.pill.alert{background:var(--alert-bg);color:var(--alert)}
.st{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600}
.st.ok{color:var(--ok)}.st.watch{color:var(--watch)}.st.alert{color:var(--alert)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.chip.normal{background:var(--ok-bg);color:var(--ok)}.chip.limite{background:var(--watch-bg);color:var(--watch)}.chip.alto,.chip.bajo{background:var(--alert-bg);color:var(--alert)}
.small{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:9px;border:1px solid #D5D8D2;background:var(--surface);font-size:14px;font-weight:600;text-decoration:none;color:var(--ink);cursor:pointer}
.btn:hover{background:var(--soft)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:#454B51;text-decoration:none;min-height:36px;margin-bottom:8px}
.disc{margin-top:28px;font-size:13px;color:var(--muted);max-width:72ch}

/* ---------- Resumen ---------- */
.rs-head{display:flex;flex-direction:column;gap:10px;max-width:720px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.olist{margin-top:20px;overflow:hidden}
.ohead,.orow{display:grid;grid-template-columns:120px minmax(0,1fr) 140px 150px 92px;gap:16px;align-items:center;padding:13px 20px}
.ohead{font-size:13px;color:var(--muted);padding-top:12px;padding-bottom:10px}
.orow{border-top:1px solid var(--line);text-decoration:none;color:inherit}
.orow:hover{background:var(--soft)}
.orow .nm{display:flex;flex-direction:column;gap:3px;min-width:0}
.orow .nm b{font-size:16px}
.orow .nm>span{font-size:14px;color:var(--muted);line-height:1.35}
.orow .val{display:flex;flex-direction:column;gap:2px}
.orow .val small{font-size:13px;color:var(--muted)}
.orow .val b{font-size:17px}
.orow .val b i{font-style:normal;font-size:13px;font-weight:500;color:var(--muted)}
.orow .fe{font-size:13px;color:var(--muted);text-align:right}
.orow svg.sp{width:150px;height:36px}
.last{margin-top:16px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:16px 20px}
.last b{font-size:16px}
.gen{margin-top:28px;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.gen h2{font-size:18px}
.gen p{max-width:72ch}

/* ---------- Conclusiones y definiciones ---------- */
.concl{border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.concl h3{font-size:15px}
.concl p{font-size:15px;line-height:1.55;color:var(--ink2);max-width:76ch}
.concl.ok{background:var(--ok-bg)}.concl.ok h3{color:var(--ok)}
.concl.watch{background:var(--watch-bg)}.concl.watch h3{color:var(--watch)}
.concl.alert{background:var(--alert-bg)}.concl.alert h3{color:var(--alert)}
.defs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 28px}
.defs dt{font-size:15px;font-weight:600}
.defs dd{font-size:14px;line-height:1.55;color:var(--ink2);margin-top:3px}
.explain{padding:22px 24px;display:flex;flex-direction:column;gap:18px}
.explain>h2{font-size:18px}

/* ---------- Ficha de órgano ---------- */
.og-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.og-head .ttl{display:flex;flex-direction:column;gap:10px;max-width:720px}
.og-head .name{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
.seg{display:inline-flex;gap:2px;padding:3px;background:#E9EBE6;border-radius:10px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-size:14px;color:#454B51;min-height:34px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(22,25,27,.12)}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:24px}
.ch{padding:18px 18px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ch.wide{grid-column:1/-1}
.ch .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ch h3{font-size:17px}
.ch .now{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.ch .now b{font-size:24px;line-height:1}
.ch .now b i{font-style:normal;font-size:13px;font-weight:500;color:var(--muted)}
.cv{position:relative;height:220px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:#454B51}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-sq{width:14px;height:10px;border-radius:2px;background:var(--band);box-shadow:inset 0 0 0 1px var(--bandline)}
.lg-dot{width:9px;height:9px;border-radius:50%;background:var(--series)}
.lg-ring{width:9px;height:9px;border-radius:50%;border:2px solid var(--series);background:#fff}
.lg-dash{width:16px;height:0;border-top:1.5px dashed var(--hito)}
.pick{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--ink);color:#fff}
.pick small{display:block;font-size:12px;color:#C9CDD1}
.pick b{font-size:16px}
.pick .note{flex-basis:100%;font-size:12px;color:#C9CDD1}
.pick button{border:0;background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;min-height:36px}
.ch .nota{font-size:13px;color:var(--muted)}
.blocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bk{padding:14px 16px;display:flex;flex-direction:column;gap:4px;border-left-width:1px}
.bk .d{font-size:13px;color:var(--muted)}
.bk b{font-size:15px}
.bk .m{font-size:14px;color:var(--ink2)}
.bk .tag{align-self:flex-start;margin-top:4px}
.bk button.lnk{align-self:flex-start;border:0;background:none;color:var(--series);font-size:13px;font-weight:600;padding:4px 0;cursor:pointer}
.metrics6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mt{padding:12px 14px}
.mt small{display:block;font-size:13px;color:var(--muted)}
.mt b{display:block;font-size:19px;margin:2px 0}
.side2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;align-items:start;margin-top:28px}
.lst{padding:18px 20px 8px}
.lst h2{font-size:16px;margin-bottom:6px}
.it{display:flex;flex-direction:column;gap:3px;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
.it .r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.it .r1 b{font-size:14px}
.it .r1 span{font-size:13px;color:var(--muted);white-space:nowrap}
.it .r2{font-size:13px;line-height:1.45;color:var(--ink2)}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
.pn a{display:flex;flex-direction:column;gap:2px;padding:12px 16px;text-decoration:none;color:inherit;min-width:0;flex:1 1 0}
.pn a small{font-size:13px;color:var(--muted)}
.pn a b{font-size:16px}
.pn a.nx{text-align:right}

/* ---------- Línea de tiempo e imágenes ---------- */
.trends{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tr{padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.tr small{font-size:13px;color:var(--muted)}
.tr b{font-size:16px}
.tr span{font-size:13px;color:var(--ink2)}
.tl{position:relative;padding:4px 0 4px 26px}
.tl::before{content:"";position:absolute;left:8px;top:10px;bottom:10px;width:2px;background:var(--line)}
.ti{position:relative;padding:10px 0 14px}
.ti::before{content:"";position:absolute;left:-23px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--muted)}
.ti.ok::before{border-color:var(--ok)}.ti.watch::before{border-color:var(--watch-dot)}.ti.alert::before{border-color:var(--alert)}
.ti b{display:block;font-size:14px}
.ti p{font-size:15px;line-height:1.5;color:var(--ink2);max-width:76ch}
.studies{display:flex;flex-direction:column;gap:12px}
.study{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.study .r1{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.study b{font-size:16px}
.study p{font-size:14px;line-height:1.55;color:var(--ink2);max-width:80ch}
.study .ft{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}

/* ---------- Archivos ---------- */
.af-filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:18px 0 14px;padding-bottom:2px}
.af-filters::-webkit-scrollbar{display:none}
.af-chip{flex:0 0 auto;font-size:14px;padding:7px 13px;border-radius:999px;border:1px solid #D5D8D2;background:var(--surface);cursor:pointer;min-height:38px}
.af-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.af-list{display:flex;flex-direction:column}
.af-yr{font-size:14px;font-weight:600;color:var(--muted);margin:18px 0 8px}
.af-item{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left}
.af-item:hover{border-color:#C5C9C2}
.af-ico{width:10px;height:38px;border-radius:4px;flex:0 0 10px}
.af-mid{flex:1;min-width:0}
.af-ttl{font-size:15px;font-weight:600}
.af-dt{font-size:13px;color:var(--muted);margin-top:1px}
.af-cd{font-size:13px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.af-pg{font-size:12px;color:var(--muted);white-space:nowrap}

/* ---------- Visor de archivos (oscuro, para ver el documento) ---------- */
.lb{position:fixed;inset:0;background:rgba(10,12,14,.97);z-index:200;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color:#ECEEEF}
.lb.open{display:flex}
.lbhd{display:flex;align-items:center;gap:10px;padding:12px 14px;flex-shrink:0;border-bottom:1px solid #2C3136}
.lbico{width:10px;height:34px;border-radius:4px;flex:0 0 10px}
.lbt{flex:1;min-width:0}
.lbt h4{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbt span{font-size:13px;color:#A3AAB0}
.lbx,.lbdl{background:#1F2326;border:1px solid #30353A;color:#ECEEEF;width:40px;height:40px;border-radius:10px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lbdl:disabled{opacity:.4;cursor:default}
.lbdl.spin svg{animation:lbspin .9s linear infinite}
@keyframes lbspin{to{transform:rotate(360deg)}}
.lbstg{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}
.lbstg img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;transition:transform .2s ease;transform-origin:center center}
.lbstg img.zoomed{transition:none;cursor:grab}
.lbnv{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(31,35,38,.85);border:1px solid #30353A;color:#ECEEEF;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.lbnv:disabled{opacity:.2;pointer-events:none}
.lbpv{left:10px}.lbnx{right:10px}
.lbft{flex-shrink:0;text-align:center;padding:10px;font-size:13px;color:#A3AAB0}
.lbft .lbhnt{font-size:12px;color:#7D858C;margin-top:2px}
@media(min-width:700px){.lbstg img{max-width:820px}}

footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);max-width:80ch}

/* ---------- Animación de cambio de ficha (móvil, solo con swipe) ---------- */
@keyframes slInR{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes slInL{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.view.sl-r{animation:slInR .24s cubic-bezier(.22,.61,.36,1)}
.view.sl-l{animation:slInL .24s cubic-bezier(.22,.61,.36,1)}
@media(prefers-reduced-motion:reduce){.view.sl-r,.view.sl-l{animation:none}.lbstg img{transition:none}}

/* ---------- Tablet ---------- */
@media(max-width:1180px){
  .ohead,.orow{grid-template-columns:110px minmax(0,1fr) 120px 120px 80px}
  .orow svg.sp{width:120px}
  .trends{grid-template-columns:repeat(3,minmax(0,1fr))}
}
/* ---------- Móvil ---------- */
@media(max-width:979px){
  .side{display:none}
  .app{display:block}
  main{padding:4px 16px calc(92px + env(safe-area-inset-bottom,0px))}
  .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;background:rgba(243,244,241,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid transparent}
  .mtop img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#2a2e33}
  .mtop b{font-size:16px}
  .mtop span{font-size:12px;color:var(--muted);display:block;line-height:1.2}
  .tabbar{display:flex;justify-content:space-around;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:46px;justify-content:center;font-size:11.5px;color:var(--muted);text-decoration:none}
  .tabbar a.on{color:var(--ink);font-weight:600}
  .view{padding-top:8px}
  .h1{font-size:26px}
  .lead{font-size:16px}
  .ohead{display:none}
  .orow{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:14px 16px}
  .orow .stc{display:none}
  .orow .nm{grid-row:1/3}
  .orow .nm b{display:flex;align-items:center;gap:8px}
  .orow .nm>span{font-size:13px}
  .orow .val{align-items:flex-end;grid-row:1;grid-column:2}
  .orow .val small{display:none}
  .orow .val b{font-size:16px}
  .orow svg.sp{grid-column:2;width:84px;height:26px;justify-self:end}
  .orow .fe{display:none}
  .olist{border-radius:16px}
  .og-head{align-items:flex-start}
  .seg{width:100%}
  .seg button{flex:1}
  .charts{grid-template-columns:1fr;gap:14px;margin-top:18px}
  .cv{height:200px}
  .ch .now b{font-size:21px}
  .blocks,.defs,.side2{grid-template-columns:1fr}
  .metrics6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .trends{grid-template-columns:repeat(2,minmax(0,1fr))}
  .explain,.gen{padding:18px}
  .pn a b{font-size:15px}
}
@media(min-width:980px){.mst{display:none}}
</style>
</head>
<body>

/* ---------- Formato ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function num(v, dec){
  var s = (dec != null) ? Number(v).toFixed(dec) : String(v);
  var parts = s.split('.');
  if (Math.abs(v) >= 1000) parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return parts.length > 1 ? parts[0] + ',' + parts[1] : parts[0];
}
/* En los textos, el punto decimal pasa a coma; los miles (100.000) se dejan como están. */
function prose(html){
  return String(html).replace(/(\d+)\.(\d+)/g, function(m, a, b){
    if (b.length === 3 && a !== '0') return m;
    return a + ',' + b;
  });
}
function dt(iso){var p=iso.split('-');return {y:+p[0],m:+p[1],d:+p[2]};}
function fLarga(iso){var x=dt(iso);return x.d+' '+MES[x.m-1]+' '+x.y;}
function fMes(iso){var x=dt(iso);return MES[x.m-1]+' '+x.y;}
function ts(iso){var x=dt(iso);return Date.UTC(x.y,x.m-1,x.d);}
function estadoValor(v, r){
  var lo=r[0], hi=r[1];
  if (lo != null && v < lo) return 'bajo';
  if (hi != null && v > hi) return 'alto';
  if ((lo != null && v === lo) || (hi != null && v === hi)) return 'limite';
  return 'normal';
}
var EST_TXT = {bajo:'Bajo', alto:'Alto', limite:'En el límite', normal:'Normal'};
function rangoTxt(r, u){
  var t = r[0] == null ? 'menor a ' + num(r[1]) : num(r[0]) + ' a ' + num(r[1]);
  return t + (u ? ' ' + u : '');
}
function ultimo(key){var p=SERIES[key].puntos;return p[p.length-1];}
function orgById(id){for(var i=0;i<ORGS.length;i++)if(ORGS[i].id===id)return ORGS[i];return null;}
function itemIdx(id){for(var i=0;i<ITEMS.length;i++)if(ITEMS[i].id===id)return i;return -1;}
function edadTxt(){
  var b=dt(C.paciente.nacimiento), n=new Date(), y=n.getFullYear()-b.y, m=(n.getMonth()+1)-b.m;
  if (n.getDate() < b.d) m--;
  if (m < 0){y--; m+=12;}
  return y + (y===1?' año':' años') + (m ? ' ' + m + (m===1?' mes':' meses') : '');
}

/* ---------- Mini gráfico (SVG) ---------- */
function spark(key){
  var s=SERIES[key], pts=s.puntos.filter(function(p){return !p.tubo || p.tubo==='con fluoruro';});
  var W=150,H=36,P=4, xs=pts.map(function(p){return ts(p.fecha);}), vs=pts.map(function(p){return p.valor;});
  var lo=s.rango[0], hi=s.rango[1];
  var vmin=Math.min.apply(null, vs.concat(lo!=null?[lo]:[])), vmax=Math.max.apply(null, vs.concat(hi!=null?[hi]:[]));
  var pad=(vmax-vmin)*0.1||1; vmin-=pad; vmax+=pad;
  var x0=xs[0], x1=xs[xs.length-1];
  function X(t){return P+(t-x0)/((x1-x0)||1)*(W-2*P);}
  function Y(v){return P+(1-(v-vmin)/(vmax-vmin))*(H-2*P);}
  var d=pts.map(function(p,i){return (i?'L':'M')+X(xs[i]).toFixed(1)+' '+Y(p.valor).toFixed(1);}).join(' ');
  var bt=hi!=null?Y(hi):0, bb=lo!=null?Y(lo):H; bt=Math.max(0,bt); bb=Math.min(H,bb);
  var e=pts[pts.length-1];
  return '<svg class="sp" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+esc(s.nombre)+' a lo largo del tiempo">'
    +'<rect x="0" y="'+bt.toFixed(1)+'" width="'+W+'" height="'+Math.max(0,bb-bt).toFixed(1)+'" fill="#E2EDE5"/>'
    +'<path d="'+d+'" fill="none" stroke="#1E4F8F" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
    +'<circle cx="'+X(xs[xs.length-1]).toFixed(1)+'" cy="'+Y(e.valor).toFixed(1)+'" r="3.2" fill="#1E4F8F" stroke="#fff" stroke-width="1.5"/></svg>';
}

      var pts=s.puntos.filter(function(p){return g[0]===null || p.tubo===g[0];});
      var data=pts.map(function(p){return {x:ts(p.fecha),y:p.valor,p:p};});
      var cols=pts.map(function(p){return COL[estadoValor(p.valor,s.rango)];});
      return {data:data, showLine:g[1], borderColor:'#1E4F8F', borderWidth:2, tension:0, label:g[0]||s.nombre,
        pointRadius:function(c){return c.dataIndex===data.length-1&&g[1]?5:3.5;}, pointHoverRadius:7, pointHitRadius:12,
        pointBackgroundColor:g[1]?cols:'#FFFFFF', pointBorderColor:g[1]?'#FFFFFF':cols, pointBorderWidth:g[1]?1.5:2};
    });
    var vals=s.puntos.map(function(p){return p.valor;});
    var lo=s.rango[0], hi=s.rango[1];
    var vmin=Math.min.apply(null,vals.concat(lo!=null?[lo]:[])), vmax=Math.max.apply(null,vals.concat(hi!=null?[hi]:[]));
    var ch=new Chart(cv,{type:'scatter',data:{datasets:ds},plugins:[bandPlugin,hitoPlugin],
      options:{responsive:true,maintainAspectRatio:false,animation:false,
        layout:{padding:{top:6,right:8}},
        interaction:{mode:'nearest',intersect:false,axis:'x'},
        scales:{
          x:{type:'linear',min:xMin()!=null?xMin():firstT-40*864e5,max:xMax(),grid:{display:false},border:{color:'#D5D8D2'},
             afterBuildTicks:xTicks,
             ticks:{color:'#596067',font:{size:11},maxRotation:0,autoSkip:false,
               callback:function(v){var d=new Date(v);return d.getUTCMonth()===0&&this.chart.$anual?String(d.getUTCFullYear()):MES[d.getUTCMonth()]+' '+String(d.getUTCFullYear()).slice(2);}}},
          y:{suggestedMin:Math.max(0,vmin-(vmax-vmin)*0.08),suggestedMax:vmax+(vmax-vmin)*0.08,grid:{color:'#ECEEEA'},border:{display:false},
             ticks:{color:'#596067',font:{size:11},maxTicksLimit:5,callback:function(v){return num(+v.toFixed(3));}}}
        },
        plugins:{legend:{display:false},banda:{rango:s.rango},hitos:{lista:hs},
          tooltip:{backgroundColor:'#16191B',titleFont:{weight:'600'},footerFont:{weight:'400'},padding:10,displayColors:false,
            callbacks:{
              title:function(it){return fLarga(it[0].raw.p.fecha);},
              label:function(it){var p=it.raw.p;var t=num(p.valor,s.decimales)+' '+s.unidad;if(p.pad)t+=' (diastólica '+p.pad+(p.pam?', media '+p.pam:'')+')';return t;},
              afterLabel:function(it){var p=it.raw.p;var a=[];if(p.tubo)a.push('Muestra '+p.tubo);a.push(EST_TXT[estadoValor(p.valor,s.rango)]);return a.join('. ');},
              footer:function(it){return 'Archivo '+it[0].raw.p.archivo;}
            }}
        },
        onClick:function(evt,els){if(!els.length)return;var p=ch.data.datasets[els[0].datasetIndex].data[els[0].index].p;showPick(k,p);}
      }});
    charts.push(ch);
  });
}
function showPick(k,p){
  var s=SERIES[k], box=document.querySelector('.pickbox[data-k="'+k+'"]'); if(!box)return;
  var extra=[]; if(p.pad)extra.push('Diastólica '+p.pad+(p.pam?', media '+p.pam:'')+' mmHg'); if(p.tubo)extra.push('Muestra '+p.tubo); if(p.nota)extra.push(p.nota);
  box.innerHTML='<div class="pick"><div><small>'+fLarga(p.fecha)+'</small><b>'+num(p.valor,s.decimales)+' '+esc(s.unidad)+'</b></div><button type="button" data-arch="'+p.archivo+'">Ver examen '+p.archivo+'</button>'+(extra.length?'<span class="note">'+esc(extra.join('. '))+'</span>':'')+'</div>';
}
function setPeriodo(p){
  periodo=p;
  document.querySelectorAll('#v-organo .seg button').forEach(function(b){var on=b.getAttribute('data-per')===p;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});
  charts.forEach(function(ch){
    var first=ch.data.datasets[0].data[0]; var m=xMin();
    ch.options.scales.x.min = m!=null?m:(first?first.x-40*864e5:undefined); ch.update();
  });
}

/* ---------- Línea de tiempo ---------- */
function renderLinea(){
  var h='<p class="eyebrow">Desde '+esc(C.linea_tiempo[0].cuando.split(' · ')[0].toLowerCase())+'</p><h1 class="h1">Línea de tiempo</h1>';
  h+='<div class="sec"><h2>Tendencias clave</h2><div class="trends">';
  C.tendencias.forEach(function(t){h+='<div class="card tr"><small>'+esc(t.t)+'</small><b class="st '+t.tono+'">'+esc(t.v)+'</b><span>'+prose(esc(t.d))+'</span></div>';});
  h+='</div></div><div class="sec"><h2>Hitos clínicos</h2><div class="card" style="padding:12px 20px"><div class="tl">';
  C.linea_tiempo.slice().reverse().forEach(function(x){h+='<div class="ti '+x.tono+'"><b>'+esc(x.cuando)+'</b><p>'+prose(esc(x.texto))+'</p></div>';});
  h+='</div></div></div>';
  document.getElementById('v-linea-de-tiempo').innerHTML=h;
}

/* ---------- Imágenes ---------- */
function renderImagenes(){
  var I=C.imagenes;
  var h='<p class="eyebrow">Ecografías y radiografías</p><h1 class="h1">Imágenes</h1><div class="sec"><div class="studies">';
  var lista=I.estudios.concat([{fecha:I.tiroides.fecha,titulo:I.tiroides.titulo,texto:null,html:I.tiroides.texto,archivos:I.tiroides.archivos,etiqueta:'Tiroides',tono:'watch'}]);
  lista.sort(function(a,b){return itemIdx(a.archivos[0])-itemIdx(b.archivos[0]);});
  lista.forEach(function(x){
    h+='<div class="card study"><div class="r1"><b>'+esc(x.titulo)+'</b><span class="small">'+esc(x.fecha)+'</span></div><p>'+(x.html?prose(x.html):prose(esc(x.texto)))+'</p><div class="ft"><span class="pill '+x.tono+'" style="font-size:13px;padding:4px 10px">'+esc(x.etiqueta)+'</span>'
      +x.archivos.map(function(a){var it=ITEMS[itemIdx(a)];return '<button class="btn" type="button" data-arch="'+a+'">'+esc(it.codes)+'</button>';}).join('')+'</div></div>';
  });
  h+='</div></div><div class="card explain sec"><h2>Qué significa cada examen</h2><dl class="defs">';
  I.definiciones.forEach(function(d){h+='<div><dt>'+esc(d.t)+'</dt><dd>'+prose(d.d)+'</dd></div>';});
  h+='</dl><div class="concl '+I.conclusion.nivel+'"><h3>'+esc(I.conclusion.titulo)+'</h3>'+I.conclusion.parrafos.map(function(p){return '<p>'+prose(p)+'</p>';}).join('')+'</div></div>';
  document.getElementById('v-imagenes').innerHTML=h;
}

/* ---------- Pie de página ---------- */
function renderPie(){
  var fechas=ITEMS.map(function(it){return it.dateLabel;});
  document.getElementById('pie').innerHTML='Expediente médico de Teodoro. '+ITEMS.length+' exámenes de VetLab, ecografías, ecocardiogramas, ECG y radiografías, desde '+esc(fechas[fechas.length-1].replace(/^\d+ /,''))+' hasta '+esc(fechas[0].replace(/^\d+ /,''))+'.<br>Esta visualización es de apoyo y no reemplaza la interpretación de su médico veterinario tratante.';
}

/* ---------- Rutas ---------- */
var VIEWS=['resumen','linea-de-tiempo','imagenes','archivos'];
var current=null;
function route(anim){
  var r=(location.hash||'#resumen').slice(1);
  if(VIEWS.indexOf(r)<0 && ORG_IDS.indexOf(r)<0) r='resumen';
  var isOrg=ORG_IDS.indexOf(r)>=0;
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('on','sl-r','sl-l');});
  var v=document.getElementById(isOrg?'v-organo':'v-'+r);
  if(isOrg) renderOrgano(r); else { charts.forEach(function(c){c.destroy();}); charts=[]; }
  v.classList.add('on');
  if(anim && window.matchMedia('(max-width:979px)').matches){void v.offsetWidth; v.classList.add(anim>0?'sl-r':'sl-l');}
  document.querySelectorAll('[data-r]').forEach(function(a){var on=a.getAttribute('data-r')===r||(isOrg&&a.getAttribute('data-r')==='resumen'&&a.closest('.tabbar'));a.classList.toggle('on',!!on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  var o=isOrg?orgById(r):null;
  document.title=(o?o.nombre+' · ':(r!=='resumen'?({'linea-de-tiempo':'Línea de tiempo','imagenes':'Imágenes','archivos':'Archivos'})[r]+' · ':''))+'Teodoro · Expediente médico';
  if(current!==null) window.scrollTo(0,0);
  current=r;
}
var pendingAnim=0;
window.addEventListener('hashchange',function(){route(pendingAnim);pendingAnim=0;});

/* ---------- Clics delegados ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-arch]'); if(b){e.preventDefault();var i=itemIdx(+b.getAttribute('data-arch'));if(i>=0)afOpenLb(i);return;}
  var p=e.target.closest('[data-per]'); if(p){setPeriodo(p.getAttribute('data-per'));}
});

/* ---------- Swipe entre órganos (solo móvil) ---------- */
(function(){
  var SX=0,SY=0,ST=0,track=false, main=document.getElementById('main');
  function lbOpen(){return document.getElementById('lb').classList.contains('open');}
  function ignore(el){while(el&&el!==main){if(el.tagName==='CANVAS'||(el.classList&&(el.classList.contains('seg')||el.classList.contains('af-filters')||el.classList.contains('pick'))))return true;el=el.parentElement;}return false;}
  main.addEventListener('touchstart',function(e){
    if(lbOpen()||e.touches.length!==1||ignore(e.target)||ORG_IDS.indexOf(current)<0){track=false;return;}
    SX=e.touches[0].clientX;SY=e.touches[0].clientY;ST=Date.now();track=true;
  },{passive:true});
  main.addEventListener('touchend',function(e){
    if(!track||lbOpen())return; track=false;
    var t=e.changedTouches[0], dx=t.clientX-SX, dy=t.clientY-SY, dt2=Date.now()-ST;
    if(Math.abs(dx)<60||Math.abs(dx)<=Math.abs(dy)*1.5||dt2>700)return;
    var i=ORG_IDS.indexOf(current), n=ORG_IDS.length;
    var j=dx<0?(i+1)%n:(i-1+n)%n; pendingAnim=dx<0?1:-1;
    location.hash='#'+ORG_IDS[j];
  },{passive:true});
})();

/* ---------- Archivos y visor ---------- */
var CATS=[['all','Todos']].concat(['sangre','orina','renal','eco','rx','cardio','resumen'].map(function(c){return [c,CAT_NAME[c]];}));
var filter='all',cur=null,pg=0,scale=1,panX=0,panY=0,psx=0,psy=0,drag=false,pinching=false,tsX=0,tsY=0,piDist=0,piScale=1,lastTap=0,lastFocus=null;
function rFilters(){
  document.getElementById('af-filters').innerHTML=CATS.map(function(c){return '<button type="button" class="af-chip'+(c[0]===filter?' on':'')+'" aria-pressed="'+(c[0]===filter)+'" onclick="afSetFilter(\''+c[0]+'\')">'+c[1]+'</button>';}).join('');
}
window.afSetFilter=function(f){filter=f;rFilters();rList();};
function rList(){
  var list=ITEMS.filter(function(it){return filter==='all'||it.cat===filter;});
  var html='',lastYr=null;
  list.forEach(function(it){
    var yr=(it.dateLabel.match(/\d{4}/)||['?'])[0];
    if(yr!==lastYr){html+='<div class="af-yr">'+yr+'</div>';lastYr=yr;}
    html+='<button type="button" class="af-item" onclick="afOpenLb('+ITEMS.indexOf(it)+')">'
      +'<span class="af-ico" style="background:'+(CAT_COLOR[it.cat]||'#596067')+'" aria-hidden="true"></span>'
      +'<span class="af-mid"><span class="af-ttl" style="display:block">'+esc(it.catLabel)+'</span><span class="af-dt" style="display:block">'+esc(it.dateLabel)+', archivo '+it.id+'</span><span class="af-cd" style="display:block">'+esc(it.codes.split(' · ').join(', '))+'</span></span>'
      +'<span class="af-pg">'+it.pages+' pág'+(it.pages>1?'s.':'.')+'</span></button>';
  });
  document.getElementById('af-list').innerHTML=html;
}
function resetZoom(){scale=1;panX=0;panY=0;drag=false;pinching=false;var img=document.getElementById('lbimg');img.classList.remove('zoomed');img.style.transform='';}
function applyT(){var img=document.getElementById('lbimg');if(scale<=1){img.style.transform='';img.classList.remove('zoomed');}else{img.style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')';img.classList.add('zoomed');}}
function showPage(){
  var img=document.getElementById('lbimg');
  resetZoom();
  img.src=cur.images[pg];
  img.alt=cur.catLabel+', '+cur.dateLabel+', página '+(pg+1);
  if(pg+1<cur.pages)new Image().src=cur.images[pg+1];
  document.getElementById('lbcnt').textContent=cur.pages>1?(pg+1)+' / '+cur.pages:'';
  document.getElementById('lbhnt').textContent=cur.pages>1?'Desliza para cambiar de página. Pellizca para acercar; doble toque vuelve al tamaño original.':'Pellizca para acercar; doble toque vuelve al tamaño original.';
  var pv=document.getElementById('lbpv'),nx=document.getElementById('lbnx');
  pv.disabled=pg<=0;nx.disabled=pg>=cur.pages-1;
  pv.style.display=cur.pages>1?'flex':'none';
  nx.style.display=cur.pages>1?'flex':'none';
}
window.afOpenLb=function(idx){
  cur=ITEMS[idx];pg=0;lastFocus=document.activeElement;
  document.getElementById('lbico').style.background=CAT_COLOR[cur.cat]||'#596067';
  document.getElementById('lbtitle').textContent=cur.catLabel;
  document.getElementById('lbsub').textContent=cur.dateLabel+', archivo '+cur.id+', '+cur.pages+' página'+(cur.pages>1?'s':'');
  document.getElementById('lb').classList.add('open');
  document.body.style.overflow='hidden';
  showPage();
  document.querySelector('.lbx').focus();
};
window.afCloseLb=function(){document.getElementById('lb').classList.remove('open');document.body.style.overflow='';cur=null;if(lastFocus&&lastFocus.focus)lastFocus.focus();};
window.afPage=function(d){if(!cur)return;var n=pg+d;if(n>=0&&n<cur.pages){pg=n;showPage();}};
var lbimg=document.getElementById('lbimg');
lbimg.addEventListener('wheel',function(e){e.preventDefault();scale=Math.max(1,Math.min(5,scale*(e.deltaY<0?1.1:1/1.1)));if(scale<=1){panX=0;panY=0;}applyT();},{passive:false});
lbimg.addEventListener('pointerdown',function(e){if(scale<=1||pinching)return;drag=true;psx=e.clientX-panX;psy=e.clientY-panY;lbimg.setPointerCapture(e.pointerId);});
lbimg.addEventListener('pointermove',function(e){if(!drag)return;panX=e.clientX-psx;panY=e.clientY-psy;applyT();});
lbimg.addEventListener('pointerup',function(){drag=false;});
lbimg.addEventListener('touchend',function(e){if(pinching)return;var now=Date.now();if(now-lastTap<300&&scale>1){resetZoom();applyT();e.preventDefault();}lastTap=now;},{passive:false});
var stg=document.getElementById('lbstg');
stg.addEventListener('touchstart',function(e){if(e.touches.length===2){pinching=true;piDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);piScale=scale;e.preventDefault();}else if(e.touches.length===1&&!pinching){tsX=e.touches[0].clientX;tsY=e.touches[0].clientY;}},{passive:false});
stg.addEventListener('touchmove',function(e){if(e.touches.length===2&&pinching){var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);scale=Math.max(1,Math.min(5,piScale*(d/piDist)));if(scale<=1){panX=0;panY=0;}applyT();e.preventDefault();}},{passive:false});
stg.addEventListener('touchend',function(e){if(e.touches.length<2)pinching=false;if(!pinching&&e.changedTouches.length===1){var dx=e.changedTouches[0].clientX-tsX,dy=e.changedTouches[0].clientY-tsY;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)&&scale<=1)afPage(dx<0?1:-1);}},{passive:false});
document.addEventListener('keydown',function(e){if(!document.getElementById('lb').classList.contains('open'))return;if(e.key==='Escape')afCloseLb();if(e.key==='ArrowRight')afPage(1);if(e.key==='ArrowLeft')afPage(-1);});
function loadJsPDF(){return new Promise(function(res,rej){if(window.jspdf){res();return;}var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
function imgData(url){return new Promise(function(res){var img=new Image();img.onload=function(){var c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);res({d:c.toDataURL('image/jpeg',0.95),w:img.naturalWidth,h:img.naturalHeight});};img.src=url;});}
window.afDownload=async function(){if(!cur)return;var btn=document.getElementById('lbdl');btn.disabled=true;btn.classList.add('spin');try{await loadJsPDF();var doc=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});for(var i=0;i<cur.images.length;i++){var p=await imgData(cur.images[i]);if(i>0)doc.addPage('a4','portrait');var A4W=210,A4H=297,asp=p.w/p.h,dw,dh,dx,dy;if(asp>A4W/A4H){dw=A4W;dh=A4W/asp;dx=0;dy=(A4H-dh)/2;}else{dh=A4H;dw=A4H*asp;dy=0;dx=(A4W-dw)/2;}doc.addImage(p.d,'JPEG',dx,dy,dw,dh);}var fname=(cur.catLabel+'_'+cur.dateLabel).replace(/[\/\\:*?"<>|]/g,'').replace(/\s+/g,'_')+'.pdf';doc.save(fname);}catch(err){console.error(err);alert('No se pudo generar el PDF. Revisa tu conexión e intenta de nuevo.');}btn.disabled=false;btn.classList.remove('spin');};

/* ---------- Inicio ---------- */
Chart.defaults.font.family='Hanken Grotesk, ui-sans-serif, system-ui, sans-serif';
renderNav(); renderResumen(); renderLinea(); renderImagenes(); renderPie(); rFilters(); rList();
document.getElementById('af-title').textContent='Archivos ('+ITEMS.length+')';
route(0);
})();
</script>

# Temperatura real del día (mínima y máxima) desde la Dirección Meteorológica de Chile.
# Corre cada vez que se guarda un registro de agua (agua.json en main), que es el disparador
# confiable, y además dos veces al día como respaldo (los horarios de GitHub pueden atrasarse o
# saltarse). Solo agrega días ya terminados que falten. Escribe clima.json.
# Secretos necesarios (Settings > Secrets and variables > Actions): DMC_USUARIO y DMC_TOKEN.
name: Clima diario (DMC)

on:
  schedule:
    - cron: '17 12 * * *'   # ~09:17 en Santiago (08:17 en invierno)
    - cron: '17 18 * * *'   # ~15:17, por si la primera falló
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['agua.json', '.github/workflows/clima.yml']

permissions:
  contents: write

concurrency:
  group: clima
  cancel-in-progress: false

jobs:
  clima:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Descargar temperaturas de la DMC
        id: dmc
        env:
          DMC_USUARIO: ${{ secrets.DMC_USUARIO }}
          DMC_TOKEN: ${{ secrets.DMC_TOKEN }}
        run: python3 scripts/clima_dmc.py

      - name: Guardar clima.json
        if: always()
        run: |
          git config user.name "clima-dmc[bot]"
          git config user.email "clima-dmc@users.noreply.github.com"
          git add clima.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Clima: temperaturas DMC $(TZ=America/Santiago date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1

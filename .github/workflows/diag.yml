# TEMPORAL: comparación puntual de temperaturas. Se borra después.
name: Diagnóstico temperatura histórica
on:
  push:
    branches: [agua-clima]
    paths: ['scripts/diag_historico.py']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/diag_historico.py
        env:
          DMC_USUARIO: ${{ secrets.DMC_USUARIO }}
          DMC_TOKEN: ${{ secrets.DMC_TOKEN }}
      - run: |
          git config user.name "clima-dmc[bot]"; git config user.email "clima-dmc@users.noreply.github.com"
          git add diag && git commit -m "Diagnóstico temporal: temperatura histórica Tobalaba nov 2026" && git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
